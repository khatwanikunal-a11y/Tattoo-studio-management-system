<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Designs &#8211; Tattoo Studio Management System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">&#128396; Tattoo Studio Management System</a>
    <div class="nav-links">
      <a href="/artists.html">Artists</a>
      <a href="/designs.html" class="active">Designs</a>
    </div>
    <div id="nav-auth"></div>
  </nav>

  <main class="page-main">
    <div class="page-header">
      <h1>Tattoo Designs</h1>
      <button class="btn btn-primary" onclick="if(requireAuth())openModal('design-modal')">+ Add Design</button>
    </div>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search by title or style&#x2026;" />
      <button class="btn btn-outline" onclick="searchDesigns()">Search</button>
      <button class="btn btn-ghost" onclick="document.getElementById('search-input').value='';loadDesigns()">Clear</button>
      <select id="currency-select" class="select-input">
        <option value="EUR">EUR &#8364;</option>
        <option value="GBP">GBP &#163;</option>
        <option value="USD">USD &#36;</option>
        <option value="INR">INR &#8377;</option>
        <option value="CAD">CAD &#36;</option>
        <option value="AUD">AUD &#36;</option>
      </select>
    </div>

    <div id="price-result" class="price-banner" style="display:none"></div>
    <div id="designs-grid" class="card-grid"></div>
  </main>

  <!-- Add Design Modal -->
  <div id="design-modal" class="modal-overlay" onclick="if(event.target===this)closeModal('design-modal')">
    <div class="modal">
      <h2>Add New Design</h2>
      <p id="design-form-error" class="error-msg"></p>
      <form id="add-design-form" onsubmit="handleAddDesign(event)" novalidate>
        <div class="form-group">
          <label for="design-artist">Artist *</label>
          <select id="design-artist" required></select>
        </div>
        <div class="form-group">
          <label for="design-title">Title *</label>
          <input type="text" id="design-title" required maxlength="150" placeholder="Design title" />
        </div>
        <div class="form-group">
          <label for="design-style">Style *</label>
          <input type="text" id="design-style" required maxlength="100" placeholder="e.g. realism, japanese, geometric" />
        </div>
        <div class="form-group">
          <label for="design-size">Size *</label>
          <select id="design-size" required>
            <option value="">Select size&#x2026;</option>
            <option value="small">Small (&#8364;80 base)</option>
            <option value="medium">Medium (&#8364;200 base)</option>
            <option value="large">Large (&#8364;450 base)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="design-description">Description</label>
          <textarea id="design-description" maxlength="500" rows="3" placeholder="Describe the design (optional)"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal('design-modal')">Cancel</button>
          <button type="submit" id="add-design-btn" class="btn btn-primary">Add Design</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Tattoo Studio Management System</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/designs.js"></script>
</body>
</html>
