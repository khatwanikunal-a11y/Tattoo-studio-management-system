<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register &#8211; Tattoo Studio Management System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">&#128396; Tattoo Studio Management System</a>
    <div class="nav-links">
      <a href="/artists.html">Artists</a>
      <a href="/designs.html">Designs</a>
    </div>
    <div id="nav-auth"></div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="auth-sub">Join Tattoo Studio Management System community</p>
      <p id="auth-error" class="error-msg"></p>
      <form onsubmit="handleRegister(event)" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required maxlength="100" autocomplete="name" placeholder="Your full name" />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters" />
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" required minlength="8" autocomplete="new-password" placeholder="Repeat your password" />
        </div>
        <button type="submit" id="register-btn" class="btn btn-primary btn-full">Create Account</button>
      </form>
      <p class="auth-switch">Already registered? <a href="/login.html">Login here</a></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>updateNavAuth();</script>
</body>
</html>
