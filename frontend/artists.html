<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artists &#8211; Tattoo Studio Management System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">&#128396; Tattoo Studio Management System</a>
    <div class="nav-links">
      <a href="/artists.html" class="active">Artists</a>
      <a href="/designs.html">Designs</a>
    </div>
    <div id="nav-auth"></div>
  </nav>

  <main class="page-main">
    <div class="page-header">
      <h1>Our Artists</h1>
      <button class="btn btn-primary admin-only" onclick="openModal('artist-modal')">+ Add Artist</button>
    </div>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search by name or speciality&#x2026;" />
      <button class="btn btn-outline" onclick="searchArtists()">Search</button>
      <button class="btn btn-ghost" onclick="document.getElementById('search-input').value='';loadArtists()">Clear</button>
    </div>

    <div id="artists-grid" class="card-grid"></div>
  </main>

  <!-- Add Artist Modal -->
  <div id="artist-modal" class="modal-overlay" onclick="if(event.target===this)closeModal('artist-modal')">
    <div class="modal">
      <h2>Add New Artist</h2>
      <p id="artist-form-error" class="error-msg"></p>
      <form id="add-artist-form" onsubmit="handleAddArtist(event)" novalidate>
        <div class="form-group">
          <label for="artist-name">Name *</label>
          <input type="text" id="artist-name" required maxlength="100" placeholder="Artist full name" />
        </div>
        <div class="form-group">
          <label for="artist-speciality">Speciality *</label>
          <input type="text" id="artist-speciality" required maxlength="100" placeholder="e.g. Realism, Japanese" />
        </div>
        <div class="form-group">
          <label for="artist-exp">Years of Experience *</label>
          <input type="number" id="artist-exp" required min="0" max="60" placeholder="0" />
        </div>
        <div class="form-group">
          <label for="artist-bio">Bio</label>
          <textarea id="artist-bio" maxlength="500" rows="3" placeholder="Short biography (optional)"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal('artist-modal')">Cancel</button>
          <button type="submit" id="add-artist-btn" class="btn btn-primary">Add Artist</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Artist Modal -->
  <div id="edit-artist-modal" class="modal-overlay" onclick="if(event.target===this)closeModal('edit-artist-modal')">
    <div class="modal">
      <h2>Edit Artist</h2>
      <p id="edit-artist-error" class="error-msg"></p>
      <form onsubmit="handleEditArtist(event)" novalidate>
        <input type="hidden" id="edit-artist-id" />
        <div class="form-group">
          <label for="edit-artist-name">Name *</label>
          <input type="text" id="edit-artist-name" required maxlength="100" />
        </div>
        <div class="form-group">
          <label for="edit-artist-speciality">Speciality *</label>
          <input type="text" id="edit-artist-speciality" required maxlength="100" />
        </div>
        <div class="form-group">
          <label for="edit-artist-exp">Years of Experience *</label>
          <input type="number" id="edit-artist-exp" required min="0" max="60" />
        </div>
        <div class="form-group">
          <label for="edit-artist-bio">Bio</label>
          <textarea id="edit-artist-bio" maxlength="500" rows="3"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal('edit-artist-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Tattoo Studio Management System</p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/artists.js"></script>
</body>
</html>
